; OMOTE-Blaster — IR repeater for the OMOTE remote.
; See README.md for architecture and verification steps.

[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200
lib_deps =
    crankyoldgit/IRremoteESP8266@^2.8.6
    tzapu/WiFiManager@^2.0.16-rc.2
    bblanchon/ArduinoJson@^7
build_flags =
    -DBLASTER_HOSTNAME=\"omote-blaster\"
    -DBLASTER_AP_NAME=\"OMOTE-Blaster-Setup\"
    -DBLASTER_HTTP_PORT=80
    -DBLASTER_OTA_PORT=3232
    -DIR_SEND_PIN=13
    -DLED_WIFI_PIN=14
    -DLED_CMD_PIN=12
    -DLED_CMD_HOLD_MS=1000
    -DPORTAL_BUTTON_PIN=0
    -DENABLE_OTA=1
    -DBLASTER_VERSION=\"0.1.0\"

; OTA upload target — Mac → device only, works across IoT VLAN.
; Usage: pio run -e d1_mini-ota -t upload
[env:d1_mini-ota]
extends = env:d1_mini
upload_protocol = custom
upload_port = 192.168.30.254
extra_scripts = tools/ota_upload.py

; ESP-01S build (1 MB flash). IR-only — no status LEDs, no portal button.
; GPIO2 is the only safe output (GPIO0 is the boot strap, GPIO1/3 are UART).
; GPIO2 must float HIGH at boot; the IR driver idles HIGH (P-FET, active-low),
; so the wiring matches the boot requirement.
[env:esp01_1m]
platform = espressif8266
board = esp01_1m
framework = arduino
monitor_speed = 115200
lib_deps =
    crankyoldgit/IRremoteESP8266@^2.8.6
    tzapu/WiFiManager@^2.0.16-rc.2
    bblanchon/ArduinoJson@^7
build_flags =
    -DBLASTER_HOSTNAME=\"omote-blaster\"
    -DBLASTER_AP_NAME=\"OMOTE-Blaster-Setup\"
    -DBLASTER_HTTP_PORT=80
    -DBLASTER_OTA_PORT=3232
    -DIR_SEND_PIN=2
    ; LED_WIFI_PIN, LED_CMD_PIN, PORTAL_BUTTON_PIN intentionally omitted —
    ; the source uses #ifdef on these, so leaving them undefined compiles the
    ; corresponding logic out entirely.
    -DLED_CMD_HOLD_MS=1000
    -DENABLE_OTA=1
    -DBLASTER_VERSION=\"0.1.0-esp01\"
; 1M flash split: 512 KB sketch + 512 KB OTA slot, no SPIFFS.
board_build.ldscript = eagle.flash.1m512.ld

[env:esp01_1m-ota]
extends = env:esp01_1m
upload_protocol = custom
upload_port = omote-blaster.local
extra_scripts = tools/ota_upload.py
